name: User Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'user-service/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/user-service

jobs:

  # 1. JOB BUILD (Chỉ biên dịch code)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Code
        working-directory: user-service
        run: ./mvnw clean compile

  # 2. JOB TEST (Chỉ chạy khi Build thành công)
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Automated Tests
        working-directory: user-service
        run: ./mvnw test

  # 3. JOB PUSH IMAGE (Chỉ chạy khi Test thành công)
  push-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 4. JOB DEPLOY (Chỉ chạy khi Push Image thành công)
  deploy:
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Deploy Render
        run: |
          curl -X POST "${{ secrets.RENDER_USER_HOOK }}"