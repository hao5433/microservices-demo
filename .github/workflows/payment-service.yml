name: Payment Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'payment-service/**'

jobs:

  # 1. JOB BUILD (Kiểm tra compile/build thử ứng dụng Java)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Code
        working-directory: payment-service
        run: ./mvnw clean compile

      # Lưu lại source để các job sau kế thừa không phải tải lại từ đầu
      - name: Upload Workspace
        uses: actions/upload-artifact@v4
        with:
          name: payment-artifacts
          path: .

  # 2. JOB TEST (Chỉ chạy khi Build thành công)
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        working-directory: payment-service
        run: ./mvnw test

  # 3. JOB PUSH IMAGE (Chỉ chạy khi Test thành công)
  push-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u ${{ github.actor }} \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/payment-service:latest \
          ./payment-service

      - name: Push Image
        run: |
          docker push \
          ghcr.io/${{ github.repository_owner }}/payment-service:latest

  # 4. JOB DEPLOY (Chỉ chạy khi đã Push Image thành công)
  deploy:
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Deploy Render
        run: |
          curl -X POST \
          "${{ secrets.RENDER_PAYMENT_HOOK }}"